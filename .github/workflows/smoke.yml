name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          set -e
          URL="${{ secrets.SMOKE_BASE_URL }}"
          if [ -z "$URL" ]; then URL="https://medical-aid-automation.vercel.app"; fi
          echo "Checking $URL/api/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$URL/api/health")
          echo "HTTP $code"
          cat /tmp/health.json
          test "$code" = "200"
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('ok') is True"
      - name: Public pages
        run: |
          URL="${{ secrets.SMOKE_BASE_URL }}"
          if [ -z "$URL" ]; then URL="https://medical-aid-automation.vercel.app"; fi
          for path in / /intake /request-status /me /guide /org/register; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
