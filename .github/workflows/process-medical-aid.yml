name: Process Medical Aid Responses

on:
  # Run every day at 06:00 UTC (08:00 Cairo / EEST)
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, do not write)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Process new responses
        env:
          PROCESS_SECRET: ${{ secrets.PROCESS_SECRET }}
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set repository secret VERCEL_APP_URL"
            exit 1
          fi

          curl -sS -X POST "$APP_URL/api/process" \
            -H "Content-Type: application/json" \
            -H "x-process-secret: $PROCESS_SECRET" \
            -d "{\"dryRun\": $DRY_RUN}" | tee result.json

      - name: Sync Approved-Requests → chronic programs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PROCESS_SECRET: ${{ secrets.PROCESS_SECRET }}
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          # Idempotent full-sheet sync (also runs inside /api/process when DATABASE_URL is set)
          curl -sS -X POST "$APP_URL/api/programs/sync-from-sheet" \
            -H "Content-Type: application/json" \
            -H "x-process-secret: $PROCESS_SECRET" | tee sync.json

      - name: Summary
        if: always()
        run: |
          echo "### Process" >> $GITHUB_STEP_SUMMARY
          if [ -f result.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f sync.json ]; then
            echo "### Chronic enroll sync" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat sync.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
