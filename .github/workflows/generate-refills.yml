name: Generate Monthly Refills

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'Period YYYY-MM (empty = current month)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate refills
        env:
          PROCESS_SECRET: ${{ secrets.PROCESS_SECRET }}
          APP_URL: ${{ secrets.VERCEL_APP_URL || 'https://medical-aid-automation.vercel.app' }}
          PERIOD: ${{ github.event.inputs.period }}
        run: |
          set -e
          body='{}'
          if [ -n "$PERIOD" ]; then
            body="{\"period\":\"$PERIOD\"}"
          fi

          http_code=$(curl -sS -o out.json -w "%{http_code}" -X POST "$APP_URL/api/refills/generate" \
            -H "Content-Type: application/json" \
            -H "x-process-secret: $PROCESS_SECRET" \
            -d "$body") || true

          echo "HTTP $http_code"
          cat out.json || true
          echo

          echo "### Generate refills" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP $http_code" >> "$GITHUB_STEP_SUMMARY"
          if [ -f out.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$http_code" != "200" ]; then
            echo "::error::Generate failed. Ensure DATABASE_URL is set on Vercel and programs exist."
            exit 1
          fi
